<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Магазин игрушек{% endblock %} · ToyLand</title>
    <style>
        :root { --accent: #ff7a59; --accent-dark: #e05a38; --bg: #fff8f2;
                --card: #ffffff; --text: #2d2a32; --muted: #7a7480;
                --ok: #2e9d6a; --err: #c9364b; }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: "Segoe UI", Roboto, Arial, sans-serif;
               background: var(--bg); color: var(--text); }
        header { background: var(--accent); color: #fff; padding: 16px 24px; }
        header a { color: #fff; text-decoration: none; font-size: 1.4rem;
                   font-weight: 700; }
        main { max-width: 860px; margin: 24px auto; padding: 0 16px; }
        .card { background: var(--card); border-radius: 14px; padding: 20px 24px;
                box-shadow: 0 2px 10px rgba(0, 0, 0, .06); margin-bottom: 20px; }
        h1, h2, h3 { margin-top: 0; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 10px 8px;
                 border-bottom: 1px solid #f0e6df; }
        th { color: var(--muted); font-weight: 600; }
        .price { white-space: nowrap; font-weight: 600; }
        .old-price { color: var(--muted); text-decoration: line-through;
                     font-weight: 400; margin-right: 6px; }
        .btn { display: inline-block; background: var(--accent); color: #fff;
               border: 0; border-radius: 8px; padding: 8px 16px;
               text-decoration: none; cursor: pointer; font-size: 1rem; }
        .btn:hover { background: var(--accent-dark); }
        input[type=text] { padding: 8px 10px; border: 1px solid #dcd2cb;
                           border-radius: 8px; font-size: 1rem; width: 100%; }
        .inline-form { display: flex; gap: 8px; flex-wrap: wrap; }
        .inline-form input[type=text] { flex: 1 1 200px; width: auto; }
        .msg-ok { color: var(--ok); }
        .msg-err, .errorlist { color: var(--err); }
        .errorlist { padding-left: 18px; margin: 4px 0; }
        .field { margin-bottom: 14px; }
        .field label { display: block; margin-bottom: 4px; color: var(--muted); }
    </style>
</head>
<body>
    <header><a href="/">🧸 ToyLand — магазин детских игрушек</a></header>
    <main>{% block content %}{% endblock %}</main>
</body>
</html>
